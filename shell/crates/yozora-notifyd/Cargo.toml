[package]
name = "yozora-notifyd"
version = "0.1.0"
description = "The Yozora notification server: org.freedesktop.Notifications, the notification center's history and a control socket, with no toolkit"
edition.workspace = true
license.workspace = true

[lib]
name = "yozora_notifyd"
path = "src/lib.rs"

[[bin]]
name = "yozora-notify"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-channel = "2"
async-io = "2"
futures-lite = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
yozora-config = { path = "../../../crates/yozora-config" }
yozora-ipc = { path = "../../../crates/yozora-ipc" }
yozora-services = { path = "../yozora-services" }
zbus = { version = "5", default-features = false, features = ["async-io"] }
