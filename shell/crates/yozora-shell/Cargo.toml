[package]
name = "yozora-shell"
version = "0.0.0"
edition.workspace = true
license.workspace = true

[dependencies]
rune.workspace = true
yozora-style.workspace = true
yozora-services = { path = "../yozora-services" }
chrono = "0.4"
yozora-config = { path = "../../../crates/yozora-config" }
futures-lite = "2"
tracing = "0.1"
yozora-search = { path = "../yozora-search" }
yozora-ipc = { path = "../../../crates/yozora-ipc" }
async-channel = "2"
async-io = "2"
serde_json = "1"
yozora-lockd = { path = "../yozora-lockd" }

[[bin]]
name = "yozora-shell"
path = "src/main.rs"

[[bin]]
name = "yozora-lock"
path = "src/bin/lock.rs"

[[bin]]
name = "snap"
path = "src/bin/snap.rs"
