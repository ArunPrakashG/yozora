[package]
name = "yozora-lockd"
version = "0.1.0"
description = "The lock screen's engine, without a UI: PAM checks, the password field's state, system status, wallpaper and the control socket"
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1"
async-channel = "2"
async-io = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
futures-lite = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
libc = "0.2"
serde_json = "1"
tracing = "0.1"
yozora-config = { path = "../../../crates/yozora-config" }
yozora-ipc = { path = "../../../crates/yozora-ipc" }
yozora-services = { path = "../yozora-services" }
zbus = { version = "5", default-features = false, features = ["async-io"] }
zeroize = "1"
