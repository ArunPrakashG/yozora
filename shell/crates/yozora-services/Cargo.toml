[package]
name = "yozora-services"
version = "0.0.0"
edition.workspace = true
license.workspace = true
description = "System integrations for the Yozora shell: audio, network, media, tray, Hyprland, notifications"

[dependencies]
anyhow = "1"
async-channel = "2"
async-io = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
futures-lite = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
resvg = { version = "0.46", default-features = false }
uuid = { version = "1", features = ["v5"] }
yozora-config = { path = "../../../crates/yozora-config" }
yozora-ipc = { path = "../../../crates/yozora-ipc" }
yozora-module = { path = "../../../crates/yozora-module" }
zbus = { version = "5", default-features = false, features = ["async-io"] }
