[workspace]
resolver = "3"
members = [
    "crates/yozora-ui",
    "crates/yozora-config",
    "crates/yozora-ipc",
    "crates/yozora-bar",
    "crates/yozora-settings",
    "crates/yozora-lock",
    "crates/yozora-notify",
    "crates/yz-pointer",
]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/ArunPrakashG/yozora"

[workspace.dependencies]
# GPUI from Zed main at a pinned revision, on our fork: Zed 26363aa plus ext-session-lock-v1
# (zed-industries/zed#65055) for the lock screen. crates.io gpui predates layer-shell and popups.
# Bump on purpose: the Wayland platform code changes often.
gpui = { git = "https://github.com/ArunPrakashG/zed", rev = "b1ae934ca242b3dedc1a534fe64833fc26e3792b" }
gpui_platform = { git = "https://github.com/ArunPrakashG/zed", rev = "b1ae934ca242b3dedc1a534fe64833fc26e3792b", features = ["wayland"] }
anyhow = "1"
async-channel = "2"
async-io = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
futures-lite = "2"
inotify = { version = "0.11", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_ignored = "0.1"
serde_json = "1"
toml = "0.8"
toml_edit = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zbus = { version = "5", default-features = false, features = ["async-io"] }

yozora-config = { path = "crates/yozora-config" }
yozora-ipc = { path = "crates/yozora-ipc" }
yozora-ui = { path = "crates/yozora-ui" }

# Zed's workspace patches these, and GPUI relies on the patched versions.
[patch.crates-io]
async-task = { git = "https://github.com/zed-industries/async-task.git", rev = "015845a19fc31752c02367567d3b8900a406f9da" }
async-process = { git = "https://github.com/zed-industries/async-process.git", rev = "0b6d6713570af61806e1e5cb40e0f757cb93fd9d" }

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
