# Yozora for Hyprland 0.53 and 0.54 (hyprlang config). On 0.55 and later, use yozora.lua.
# Add `source = ~/.config/hypr/yozora.conf` to hyprland.conf, or paste the parts you want.

# Start the bar and the notification server. Skip this if you use the systemd units
# (`systemctl --user enable --now yozora-bar yozora-notify`). Stop mako or dunst first: only one
# notification server can run.
exec-once = yozora-bar
exec-once = yozora-notify

# Blur behind the bar, its popovers, toasts and the launcher.
layerrule {
  name = yozora-blur
  match:namespace = ^yozora-
  blur = on
  blur_popups = on
  ignore_alpha = 0.2
  no_anim = on
}

# Settings opens as a floating window at its own size.
windowrule {
  name = yozora-settings
  match:class = ^(yozora-settings)$
  float = on
  size = 1180 800
  center = on
}

# The lock screen runs from hypridle: in ~/.config/hypr/hypridle.conf, set
# `lock_cmd = yozora-lock`, `before_sleep_cmd = loginctl lock-session` and `inhibit_sleep = 3`.
# Then this key locks too:
# bind = SUPER, L, exec, loginctl lock-session

# The launcher. It starts on login and stays ready, so it opens on the next frame. With the systemd unit, enable
# yozora-launch too; otherwise start it here. Then pick a key (SUPER + Space here; drop any other launcher's bind):
# exec-once = yozora-launch
# bind = SUPER, SPACE, exec, yozora-launch toggle

# Optional keys for the bar's popovers.
# bind = SUPER, N, exec, yozora-bar msg toggle notifications
# bind = SUPER, A, exec, yozora-bar msg toggle control-center
