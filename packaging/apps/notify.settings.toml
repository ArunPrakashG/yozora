# Settings schema for Yozora Notify, rendered as its page in Yozora Settings.

[[section]]
title = "Toasts"

[[section.field]]
key     = "toasts.timeout_ms"
kind    = "int"
label   = "Time on screen"
help    = "Milliseconds before a toast goes to the center, unless the app asks for another time. Critical toasts stay until dismissed."
default = 5000
min     = 1000
max     = 120000
step    = 500

[[section.field]]
key     = "toasts.max_visible"
kind    = "int"
label   = "At most on screen"
help    = "More than this and the oldest goes to the center."
default = 4
min     = 1
max     = 8

[[section.field]]
key     = "toasts.monitor"
kind    = "string"
label   = "Monitor"
help    = "`focused`, or a connector name such as DP-1."
default = "focused"

[[section.field]]
key     = "toasts.show_low"
kind    = "bool"
label   = "Show low-urgency toasts"
help    = "Low-urgency notifications always go to the center; this also shows them as toasts."
default = false

[[section]]
title = "History"

[[section.field]]
key     = "history.limit"
kind    = "int"
label   = "Keep"
help    = "Notifications kept in the center. The oldest go first."
default = 200
min     = 0
max     = 2000
step    = 50

[[section]]
title       = "Smart sorting (Jev)"
description = "Asks Jev, TypeSafe AI's classifier, how urgent each notification is, whether it's private, what kind it is and whether it asks for something. Toasts that can wait leave early and fold into Can wait, urgent ones still show during Do Not Disturb and come back if missed, and private ones hide while you share your screen. Each notification's app, title and (if allowed) text are sent to TypeSafe AI. Critical, progress and transient notifications are never sent."

[[section.field]]
key     = "jev.enabled"
kind    = "bool"
label   = "Sort with Jev"
default = false

[[section.field]]
key     = "jev.api_key"
kind    = "string"
label   = "API key"
help    = "Your TypeSafe AI key. Saving it makes notify.toml readable only by you."
default = ""
secret  = true

[[section.field]]
key     = "jev.send_body"
kind    = "bool"
label   = "Send the text"
help    = "Off sends only the app and title."
default = true

[[section.field]]
key     = "jev.skip_apps"
kind    = "list"
label   = "Never send from"
help    = "App names or desktop entries, such as a password manager or a chat app you keep private."
default = []

[[section.field]]
key     = "jev.quiet_below"
kind    = "float"
label   = "Quiet below"
help    = "Odds of needing attention below this make a notification quiet."
default = 0.25
min     = 0
max     = 1
step    = 0.05

[[section.field]]
key     = "jev.breakthrough"
kind    = "float"
label   = "Break through Do Not Disturb at"
help    = "Odds at or above this show the toast even during Do Not Disturb."
default = 0.85
min     = 0
max     = 1
step    = 0.05

[[section.field]]
key     = "jev.remind_after_min"
kind    = "int"
label   = "Remind about urgent ones after"
help    = "Minutes before an urgent notification you haven't seen is shown again, once. 0 never."
default = 10
min     = 0
max     = 1440
step    = 5

[[section.field]]
key     = "jev.learn"
kind    = "bool"
label   = "Learn from what you open"
help    = "Sends how often you opened or dismissed each app's notifications, so Jev learns what matters to you. Only counts, never content."
default = true
