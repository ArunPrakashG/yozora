[package]
name = "yozora-cli"
version = "0.1.0"
description = "The yozora command: read and control the Yozora desktop from scripts and AI agents"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "yozora"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
async-io.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
toml.workspace = true
toml_edit.workspace = true
yozora-config.workspace = true
yozora-ipc.workspace = true
yozora-module.workspace = true
zbus.workspace = true
