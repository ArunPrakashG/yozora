<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Yozora bar and quick settings</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="tokens.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Geist+Mono:wght@500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#8BBEFF}a:hover{color:#B7D6FF}
.wall-mid{background: radial-gradient(70% 90% at 80% 0%, #1D2C52 0%, rgba(29,44,82,0) 60%), radial-gradient(60% 80% at 10% 100%, #1C1636 0%, rgba(28,22,54,0) 60%), #070A12;}
.wall-day{background: radial-gradient(70% 90% at 80% 0%, #FFFFFF 0%, rgba(255,255,255,0) 60%), radial-gradient(60% 80% at 10% 100%, #D3DBEE 0%, rgba(211,219,238,0) 60%), #E2E7F1;}
.bar{height:var(--yz-bar-h);border-radius:8px;background:var(--yz-glass-bar);border:1px solid var(--yz-line);box-shadow:inset 0 1px 0 var(--yz-hi);display:flex;align-items:center;padding:0 5px;gap:4px;box-sizing:border-box;color:var(--yz-ink)}
.bb{height:26px;min-width:26px;padding:0 8px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;gap:6px;color:var(--yz-ink);font:var(--yz-text-meta);background:transparent;border:0;box-sizing:border-box}
.bb.open{background:var(--yz-fill-press)}
.bb .n{font:var(--yz-text-num)}
.ws{display:flex;align-items:center;gap:4px;height:26px;padding:0 4px;position:relative}
.ws i{width:6px;height:6px;border-radius:3px;background:var(--yz-ink-3);display:block}
.ws i.used{background:var(--yz-ink-2)}
.ws i.on{width:20px;background:var(--yz-accent)}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px;padding:2px;border-radius:8px;background:var(--yz-fill)}
.seg button{height:28px;border:0;border-radius:6px;background:transparent;color:var(--yz-ink-2);font:var(--yz-text-meta);cursor:pointer}
.seg button.on{background:var(--yz-surface);color:var(--yz-ink);box-shadow:0 0 0 1px var(--yz-line-strong)}
</style>
</helmet>
<div class="yz-midnight" style="width: 1440px; min-height: 1040px; box-sizing: border-box; padding: 72px 60px; background: #0A0E17; color: var(--yz-ink); display: flex; flex-direction: column; gap: 32px;">

  <header style="display: flex; flex-direction: column; gap: 10px;">
    <h1 style="margin: 0; font: 600 40px/44px var(--yz-font); letter-spacing: -0.02em;">Bar and quick settings</h1>
    <p style="margin: 0; font: 400 16px/24px var(--yz-font); color: var(--yz-ink-2);">The bar is the only glass. Everything it opens is a raised surface pinned under its button.</p>
  </header>

  <section aria-label="Desktop, Midnight" class="yz-midnight wall-mid" style="position: relative; height: 620px; border-radius: 12px; border: 1px solid var(--yz-line); padding: 8px; box-sizing: border-box;">
    <nav class="bar" aria-label="Bar">
      <span class="bb" aria-label="Launcher"><svg width="16" height="16" viewBox="0 0 100 100" aria-hidden="true"><g stroke="#8BBEFF" stroke-opacity="0.6" stroke-width="5" fill="none"><path d="M27 25 L50 53 L75 29 M50 53 L48 81"></path></g><circle cx="27" cy="25" r="8" fill="#EDF2FC"></circle><circle cx="75" cy="29" r="8" fill="#EDF2FC"></circle><circle cx="50" cy="53" r="11" fill="#8BBEFF"></circle><circle cx="48" cy="81" r="8" fill="#EDF2FC"></circle></svg></span>
      <span class="ws" role="group" aria-label="Workspaces, 2 of 5"><i class="used"></i><i class="on"></i><i class="used"></i><i></i><i></i></span>
      <span style="flex: 1 1 auto; text-align: center; font: var(--yz-text-meta); color: var(--yz-ink-2);">Ghostty · ~/Projects/yozora</span>
      <span class="bb" aria-label="Now playing"><svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 5h3v14H7zM14 5h3v14h-3z"></path></svg>Nils Frahm · Says</span>
      <span class="bb" aria-label="Network"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="14" width="4" height="6" rx="1"></rect><rect x="10" y="9" width="4" height="11" rx="1"></rect><rect x="17" y="4" width="4" height="16" rx="1"></rect></svg></span>
      <span class="bb open" aria-label="Quick settings, open"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H3v6h3l5 4z"></path><path d="M15.5 8.5a5 5 0 0 1 0 7"></path></svg><span class="n">62</span></span>
      <span class="bb" aria-label="Notifications, 6 unread"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9a6 6 0 0 1 12 0c0 6 2.5 7.5 2.5 7.5h-17S6 15 6 9z"></path><path d="M10 20a2 2 0 0 0 4 0"></path></svg><span class="n">6</span></span>
      <span class="bb"><span class="n" style="font-weight: 600;">Tue 3 Nov  21:48</span></span>
    </nav>

    <div class="yz-surface" role="dialog" aria-label="Quick settings" style="position: absolute; top: 52px; right: 128px; width: 380px; border-radius: var(--yz-radius-xl); padding: 8px; display: flex; flex-direction: column; gap: 8px; box-sizing: border-box;">
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;">
        <button class="yz-tile on" type="button" aria-pressed="true">
          <span class="yz-tile-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="14" width="4" height="6" rx="1"></rect><rect x="10" y="9" width="4" height="11" rx="1"></rect><rect x="17" y="4" width="4" height="16" rx="1"></rect></svg></span>
          <span style="display: flex; flex-direction: column; min-width: 0;"><span style="font: var(--yz-text-strong);">Ethernet</span><span style="font: var(--yz-text-meta); color: var(--yz-ink-2);">1 Gb/s</span></span>
        </button>
        <button class="yz-tile" type="button" aria-pressed="false">
          <span class="yz-tile-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"></path></svg></span>
          <span style="display: flex; flex-direction: column; min-width: 0;"><span style="font: var(--yz-text-strong);">Do Not Disturb</span><span style="font: var(--yz-text-meta); color: var(--yz-ink-2);">Off</span></span>
        </button>
        <button class="yz-tile on" type="button" aria-pressed="true">
          <span class="yz-tile-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 8h1a4 4 0 0 1 0 8h-1M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4z"></path><path d="M6 2v2M10 2v2M14 2v2"></path></svg></span>
          <span style="display: flex; flex-direction: column; min-width: 0;"><span style="font: var(--yz-text-strong);">Keep awake</span><span style="font: var(--yz-text-meta); color: var(--yz-ink-2);">On</span></span>
        </button>
        <button class="yz-tile" type="button" aria-pressed="false">
          <span class="yz-tile-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg></span>
          <span style="display: flex; flex-direction: column; min-width: 0;"><span style="font: var(--yz-text-strong);">Passwordless sudo</span><span style="font: var(--yz-text-meta); color: var(--yz-ink-2);">Off</span></span>
        </button>
      </div>

      <div style="display: flex; flex-direction: column; gap: 6px; padding: 6px 4px;">
        <div style="display: flex; align-items: center; gap: 12px;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: var(--yz-ink-2); flex: none;"><path d="M11 5L6 9H3v6h3l5 4z"></path><path d="M15.5 8.5a5 5 0 0 1 0 7"></path></svg>
          <div class="yz-slider" style="flex: 1 1 auto;" role="slider" aria-label="Output volume" aria-valuenow="62"><i style="width: 62%;"></i></div>
          <span style="font: var(--yz-text-num); color: var(--yz-ink-2); width: 24px; text-align: right;">62</span>
        </div>
        <div style="display: flex; align-items: center; gap: 12px;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: var(--yz-ink-2); flex: none;"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg>
          <div class="yz-slider" style="flex: 1 1 auto;" role="slider" aria-label="Microphone" aria-valuenow="40"><i style="width: 40%;"></i></div>
          <span style="font: var(--yz-text-num); color: var(--yz-ink-2); width: 24px; text-align: right;">40</span>
        </div>
      </div>

      <div style="background: var(--yz-surface-2); border: 1px solid var(--yz-line); border-radius: var(--yz-radius-md); padding: 10px; display: flex; align-items: center; gap: 12px;">
        <span style="width: 44px; height: 44px; border-radius: 6px; flex: none; background: linear-gradient(140deg, #2B3D6B, #6A4FA8);" aria-hidden="true"></span>
        <span style="display: flex; flex-direction: column; min-width: 0; flex: 1 1 auto;"><span style="font: var(--yz-text-strong);">Says</span><span style="font: var(--yz-text-meta); color: var(--yz-ink-2);">Nils Frahm · Spotify</span></span>
        <button class="yz-icon-btn" type="button" aria-label="Previous"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 5h2v14H6zM20 5v14L9 12z"></path></svg></button>
        <button class="yz-icon-btn" type="button" aria-label="Pause" style="color: var(--yz-ink);"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 5h3v14H7zM14 5h3v14h-3z"></path></svg></button>
        <button class="yz-icon-btn" type="button" aria-label="Next"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M16 5h2v14h-2zM4 5v14l11-7z"></path></svg></button>
      </div>

      <div class="seg" role="radiogroup" aria-label="Power profile">
        <button type="button" role="radio" aria-checked="false">Saver</button>
        <button type="button" role="radio" aria-checked="true" class="on">Balanced</button>
        <button type="button" role="radio" aria-checked="false">Performance</button>
      </div>
    </div>

    <div class="yz-surface" role="status" aria-label="Volume 62" style="position: absolute; left: 50%; bottom: 40px; transform: translateX(-50%); height: 44px; width: 260px; border-radius: var(--yz-radius-full); display: flex; align-items: center; gap: 12px; padding: 0 16px; box-sizing: border-box;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H3v6h3l5 4z"></path><path d="M15.5 8.5a5 5 0 0 1 0 7"></path></svg>
      <div style="flex: 1 1 auto; height: 4px; border-radius: 2px; background: var(--yz-fill-press); overflow: hidden;"><div style="width: 62%; height: 100%; background: var(--yz-ink);"></div></div>
      <span style="font: var(--yz-text-num); width: 22px; text-align: right;">62</span>
    </div>
  </section>

  <section aria-label="Bar, Daybreak" class="yz-daybreak wall-day" style="border-radius: 12px; border: 1px solid var(--yz-line); padding: 8px 8px 72px; color: var(--yz-ink);">
    <nav class="bar" aria-label="Bar, light">
      <span class="bb" aria-label="Launcher"><svg width="16" height="16" viewBox="0 0 100 100" aria-hidden="true"><g stroke="#2A64CC" stroke-opacity="0.6" stroke-width="5" fill="none"><path d="M27 25 L50 53 L75 29 M50 53 L48 81"></path></g><circle cx="27" cy="25" r="8" fill="#0F1626"></circle><circle cx="75" cy="29" r="8" fill="#0F1626"></circle><circle cx="50" cy="53" r="11" fill="#2A64CC"></circle><circle cx="48" cy="81" r="8" fill="#0F1626"></circle></svg></span>
      <span class="ws" role="group" aria-label="Workspaces, 1 of 4"><i class="on"></i><i class="used"></i><i></i><i></i></span>
      <span style="flex: 1 1 auto; text-align: center; font: var(--yz-text-meta); color: var(--yz-ink-2);">Firefox · Yozora Design Language</span>
      <span class="bb" aria-label="Network"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="14" width="4" height="6" rx="1"></rect><rect x="10" y="9" width="4" height="11" rx="1"></rect><rect x="17" y="4" width="4" height="16" rx="1"></rect></svg></span>
      <span class="bb" aria-label="Volume 40"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H3v6h3l5 4z"></path><path d="M15.5 8.5a5 5 0 0 1 0 7"></path></svg><span class="n">40</span></span>
      <span class="bb" aria-label="Notifications, 4 unread"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9a6 6 0 0 1 12 0c0 6 2.5 7.5 2.5 7.5h-17S6 15 6 9z"></path><path d="M10 20a2 2 0 0 0 4 0"></path></svg><span class="n">4</span></span>
      <span class="bb"><span class="n" style="font-weight: 600;">Tue 3 Nov  09:12</span></span>
    </nav>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1040}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
